# Fetches every board on a schedule and builds the page the phone reads, so the
# tracker keeps working with the Mac shut. Runs on GitHub's Ubuntu runners, which
# are free and unmetered for a public repository.
#
# It is the same Swift scraper the app uses — the adapters are not reimplemented
# for the server. That is why the package builds without SwiftUI.
name: fetch

on:
  schedule:
    - cron: "17 * * * *"        # hourly, at :17 — off the hour to avoid the stampede
  workflow_dispatch:             # and on demand from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    container: swift:6.0
    permissions:
      contents: write        # only to force-push the ledger to the state branch
    steps:
      - uses: actions/checkout@v4

      # A posting has one date it was first advertised, not one per machine. The
      # workspace is thrown away when the run ends, so without this every run
      # started from an empty .seen.json and dated every undated posting today —
      # which is how Jane Street, whose board states no dates at all, came to
      # read "found today" on a page rebuilt every hour.
      #
      # The ledger lives on the `state` branch: one force-pushed commit carrying
      # no history, so the repository does not grow by a megabyte a run.
      - name: Restore the first-seen ledger
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin state 2>/dev/null \
            && git show FETCH_HEAD:first-seen.json > .seen.json \
            || echo '{}' > .seen.json
          cp .seen.json .seen.json.restored
          echo "restored $(wc -c < .seen.json) bytes"

          # Meta costs a request per posting, so the run reads only the ones it
          # has not seen. Without carrying that across runs the server pays the
          # full price every time — a minute, against a few seconds.
          git show FETCH_HEAD:meta-cache.json > .meta-cache.json 2>/dev/null \
            || echo '{}' > .meta-cache.json
          echo "meta cache $(wc -c < .meta-cache.json) bytes"

      # A release build is 30-odd seconds, and the sources are identical on every
      # run that is only refetching data — which is exactly what the page's
      # refresh button asks for.
      #
      # The build is skipped outright on a hit rather than left to decide for
      # itself, because it would rebuild anyway: checkout stamps every source
      # file with the time it was written, so a restored build directory always
      # looks older than its own inputs. Caching it and still running the build
      # bought 6 seconds of the 33; skipping the build buys all of it.
      #
      # No restore-keys, for the same reason. A near-miss restores a directory
      # that does not match these sources, and the only safe thing to do with
      # it is rebuild — which is the case this is trying to avoid. An exact hit
      # or a cold build, nothing in between.
      - name: Cache the built scraper
        id: bin
        uses: actions/cache@v4
        with:
          path: QuantJobsApp/.build
          key: swift6.0-bin-${{ hashFiles('QuantJobsApp/Package.swift', 'QuantJobsApp/Package.resolved', 'QuantJobsApp/Sources/**/*.swift') }}

      - name: Build the scraper
        if: steps.bin.outputs.cache-hit != 'true'
        run: swift build -c release --package-path QuantJobsApp

      # The marks are not in this repository and never will be — they are
      # applications and rejections, and this repo is public. They live in the
      # KV namespace behind the page's own password, so the builder is handed
      # the same credentials the Mac uses and reads them at build time.
      #
      # Without this the page is built with no applications on it at all, and
      # the browser's own pull has nowhere to put them: it only marks a row it
      # can find. An application to a firm you have switched off, or to a
      # posting the board has since taken down, was invisible on the page while
      # the app went on showing it.
      #
      # Written with the password as an argument rather than inside the format
      # string, and escaped, so a password containing % or " cannot break the
      # JSON or the printf.
      # Not a step-level `if:` — the secrets context is not available in one,
      # and using it there makes the whole file unparseable, which fails every
      # run including the scheduled ones.
      - name: Let the builder read the marks
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "no SITE_PASSWORD set; the page will be built without the marks"
            exit 0
          fi
          umask 077
          esc=$(printf '%s' "$SITE_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')
          printf '{"url":"https://quantjobs.pages.dev","password":"%s"}\n' "$esc" \
            > "$GITHUB_WORKSPACE/.sync.json"

      - name: Fetch every board and write the page
        env:
          QUANTJOBS_CONFIG: ${{ github.workspace }}
        run: |
          mkdir -p web
          BIN=$(swift build -c release --package-path QuantJobsApp --show-bin-path)
          "$BIN/QuantJobs" web/index.html
          # Gone as soon as it has been used. The workspace is thrown away
          # anyway, but the ledger step below runs a git checkout in it.
          rm -f "$GITHUB_WORKSPACE/.sync.json"
          ls -lh web/index.html

      # Pages hands every request to a _worker.js at the root of the deployed
      # directory, which is what asks for the password. It lives in site/
      # rather than web/ because web/ is generated and gitignored.
      - name: Put the password gate next to the page
        run: cp site/_worker.js web/_worker.js

      - name: Keep the page as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantjobs-page
          path: web            # the page and the function that guards it
          retention-days: 14

      # Force-pushed, so the branch is always exactly one commit and the file's
      # old versions become unreachable rather than accumulating in the history.
      # Nothing on `main` is touched.
      #
      # The size guard is the point of the step: a run where every board timed
      # out would write a nearly empty ledger, and pushing that would date every
      # posting "found today" all over again — the exact bug this fixes.
      - name: Publish the first-seen ledger
        run: |
          before=$(wc -c < .seen.json.restored)
          after=$(wc -c < .seen.json)
          echo "ledger $before -> $after bytes"
          if [ "$before" -gt 1000 ] && [ "$after" -lt $((before / 2)) ]; then
            echo "::error::ledger shrank by more than half — not publishing it"
            exit 1
          fi
          cp .seen.json first-seen.json
          cp .meta-cache.json meta-cache.json
          git checkout --orphan state-new
          git reset
          git add -f first-seen.json meta-cache.json
          git -c user.name="quantjobs" \
              -c user.email="quantjobs@users.noreply.github.com" \
              commit -q -m "first-seen ledger $(date -u +%F) ($(date -u +%R) UTC)"
          git push -qf origin state-new:state

  # Everything Cloudflare needs that does not depend on the page, run beside
  # the fetch rather than after it.
  #
  # All of it is idempotent setup — create the project, push the secrets, find
  # the namespace — and none of it looks at what was fetched, so making the
  # deploy wait for it was costing about half a minute on every run for no
  # reason. The page's refresh button waits for exactly this pipeline, so that
  # half minute was half a minute of someone watching a spinner.
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      kv_id: ${{ steps.kv.outputs.id }}
    steps:
      # Skips when the secrets are absent, so the fetch still works without them.
      # To turn it on, once:
      #   1. My Profile -> API Tokens -> Create Token, with Cloudflare Pages: Edit
      #   2. Account ID from the dashboard URL: dash.cloudflare.com/<id>/...
      #   3. this repo -> Settings -> Secrets and variables -> Actions -> add
      #      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
      #   4. add SITE_PASSWORD, and REFRESH_TOKEN if you want the page's
      #      refresh button to work, in the same place. That is the password
      #      the page asks for; without it the site answers 503 and says so.
      #      (Not the Pages "Access policy" toggle — that one covers preview
      #      deployments only and leaves quantjobs.pages.dev itself open.)
      # wrangler will not create the project implicitly — it answers 8000007,
      # "project not found". Creating it is idempotent in effect: every run after
      # the first fails with "already exists", which is why this one is allowed to.
      - name: Create the Pages project on first run
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create quantjobs --production-branch=main

      # Kept in GitHub rather than typed into the Cloudflare dashboard, so there
      # is one place to change it. Idempotent — it overwrites the same secret
      # every run. Skipped when unset, in which case the deployed site answers
      # 503 and says so rather than serving the history to anyone with the link.
      - name: Give Cloudflare the site password
        if: env.CF_TOKEN != '' && env.SITE_PASSWORD != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$SITE_PASSWORD" \
            | npx --yes wrangler@4 pages secret put SITE_PASSWORD \
                --project-name=quantjobs

      # Somewhere for the phone's marks to live. The page is rebuilt from
      # scratch every hour, so a star tapped on the train has to survive a
      # deploy, and the repository cannot hold it: that is public, and these are
      # rejections.
      #
      # Allowed to fail. The API token needs "Workers KV Storage: Edit" on top
      # of Pages: Edit, and until it has it the site should still go up — the
      # worker answers /state with 501 and the page says marks are not being
      # saved, which is a great deal better than no site.
      - name: Find or create the marks store
        id: kv
        if: env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx --yes wrangler@4 kv namespace list \
              | jq -r '.[] | select(.title | endswith("quantjobs-state")) | .id' \
              | head -1
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create quantjobs-state || true
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::warning::no KV namespace; marks will not save"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "store $id"

      # Lets the page's refresh button start this workflow. A fine-grained PAT
      # with Actions: read and write on this repository, added as REFRESH_TOKEN
      # alongside the others. Without it the button says so and nothing else
      # changes — the schedule still runs.
      - name: Give Cloudflare the refresh token
        if: env.CF_TOKEN != '' && env.REFRESH_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$REFRESH_TOKEN" \
            | npx --yes wrangler@4 pages secret put REFRESH_TOKEN \
                --project-name=quantjobs

      # So the page's ⟳ button dispatches this repository's workflow rather than
      # the one it was forked from.
      - name: Tell the worker which repository it belongs to
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ github.repository }}" \
            | npx --yes wrangler@4 pages secret put GITHUB_REPO \
                --project-name=quantjobs

  # A separate job on a plain runner: the Swift container has no Node, and the
  # Cloudflare action installs wrangler with npm. Splitting is cheaper than
  # putting a JavaScript toolchain inside the Swift image to run one command.
  #
  # All that is left here is the upload itself: the setup ran in parallel with
  # the fetch, and its namespace id arrives as a job output.
  deploy:
    needs: [fetch, bootstrap]
    runs-on: ubuntu-latest
    if: ${{ needs.fetch.result == 'success' }}
    steps:
      - name: Take the page the fetch built
        uses: actions/download-artifact@v4
        with:
          name: quantjobs-page
          path: web

      # Bindings for a direct upload come from wrangler.toml, and it is written
      # here rather than committed because the namespace id is discovered above.
      # Without an id the file omits the binding, and the deploy still happens.
      - name: Declare the deploy
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_ID: ${{ needs.bootstrap.outputs.kv_id }}
        run: |
          {
            echo 'name = "quantjobs"'
            echo 'pages_build_output_dir = "web"'
            echo 'compatibility_date = "2026-08-01"'
            if [ -n "$KV_ID" ]; then
              echo ''
              echo '[[kv_namespaces]]'
              echo 'binding = "STATE"'
              echo "id = \"$KV_ID\""
            fi
          } > wrangler.toml
          cat wrangler.toml

      - name: Publish to Cloudflare Pages
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=quantjobs --branch=main
